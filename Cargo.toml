[workspace]
resolver = "2"
members = ["crates/velox-core", "crates/velox-host", "apps/desktop/src-tauri", "apps/setup/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ethemdemirkaya/velox"
authors = ["Ethem Demirkaya"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
interprocess = { version = "2", features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
