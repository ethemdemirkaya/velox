name: Release

# Push a tag like `v0.1.0` to build installers for every platform, sign the
# updater artifacts and publish a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Velox ${{ github.ref_name }}"
          releaseBody: |
            ### Install
            * **Windows** – `Velox-Setup-*.exe` (recommended) or `Velox_*_x64-setup.exe` / `.msi`
            * **macOS** – `.dmg` (Apple Silicon: `aarch64`, Intel: `x64`)
            * **Linux** – `.AppImage` or `.deb`

            **Browser extension:** download `velox-extension.zip`, unzip, open `chrome://extensions`,
            enable *Developer mode* and click *Load unpacked*. Open the Velox app once so the browser bridge is registered.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Velox Setup: the custom dark installer (embeds the app built above).
      - name: Build Velox Setup
        if: matrix.platform == 'windows-latest'
        run: cargo build --release -p velox-setup
      - name: Upload Velox Setup
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="Velox-Setup-${GITHUB_REF_NAME#v}.exe"
          cp target/release/velox-setup.exe "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package extension
        run: cd extension && zip -r ../velox-extension.zip . -x '*.DS_Store'
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "${GITHUB_REF_NAME}" velox-extension.zip --clobber
